name: "CI"

# Continuous integration for Tamlil.
#
#  * `check`  – fast feedback on every push/PR: Rust unit tests for the Tauri
#               crate and llama-helper and the TypeScript type-check. Runs on
#               Linux, so it needs the GTK/WebKit dev packages and a placeholder
#               sidecar binary (the Tauri build script insists one exists).
#  * `build`  – unsigned desktop bundles for macOS (Apple Silicon), Windows and
#               Linux through the shared build workflow, uploaded as run artifacts.
#  * `publish` – on pushes to main, refreshes the rolling "latest" pre-release
#               with every bundle that was built, so there is one stable download
#               page: https://github.com/enpitech/Tamlil/releases/tag/latest
#
# Signed, notarised, versioned releases are produced by release.yml (manual).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build-bundles:
        description: "Also build macOS/Windows bundles"
        required: false
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Tests and type-check (Linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev cmake clang

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ci-check-linux

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Placeholder sidecar binary for the Tauri build script
        run: |
          mkdir -p frontend/src-tauri/binaries
          printf '#!/bin/sh\nexit 1\n' > frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu
          chmod +x frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu

      - name: Cache FFmpeg binary
        uses: actions/cache@v4
        with:
          path: frontend/src-tauri/binaries/ffmpeg-*
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('frontend/src-tauri/build.rs', 'frontend/src-tauri/build/ffmpeg.rs') }}

      # Failures are echoed as annotations so they are visible without the raw log.
      - name: Rust unit tests (Tauri crate)
        working-directory: frontend/src-tauri
        shell: bash
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/tauri-tests.log"
          if ! cargo test --lib --no-fail-fast 2>&1 | tee "$LOG"; then
            grep -nE '^test .* FAILED$|panicked at|^error(\[|:)|^\s+--> |^failures:' "$LOG" | head -60 | while IFS= read -r line; do
              echo "::error title=cargo test (tauri)::${line}"
            done
            exit 1
          fi

      - name: Rust unit tests (llama-helper)
        working-directory: llama-helper
        shell: bash
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/llama-helper-tests.log"
          if ! cargo test --no-fail-fast 2>&1 | tee "$LOG"; then
            grep -nE '^test .* FAILED$|panicked at|^error(\[|:)|^\s+--> |^failures:' "$LOG" | head -60 | while IFS= read -r line; do
              echo "::error title=cargo test (llama-helper)::${line}"
            done
            exit 1
          fi

  build:
    name: Bundle
    needs: check
    if: github.event_name != 'workflow_dispatch' || inputs.build-bundles
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
          - platform: "ubuntu-22.04" # experimental: .deb + AppImage
            args: "--bundles deb,appimage"
            target: "x86_64-unknown-linux-gnu"
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: false
      asset-prefix: "tamlil-ci"
      upload-artifacts: true
      is-debug-build: false
    secrets: inherit

  publish:
    name: Publish rolling "latest" pre-release
    needs: build
    # Run even if one platform failed so the others are still downloadable; never on PRs.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tamlil-ci-*
          path: dist
          merge-multiple: true

      - name: List downloads
        id: files
        shell: bash
        run: |
          find dist -type f | sort
          COUNT=$(find dist -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.sig' \) | wc -l)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Refresh the "latest" pre-release
        if: ${{ steps.files.outputs.count != '0' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' frontend/src-tauri/tauri.conf.json | cut -d'"' -f4)
          SHORT_SHA="${GITHUB_SHA::7}"
          NOTES="Automated build of \`main\` @ ${SHORT_SHA} (app version ${VERSION}, built $(date -u +'%Y-%m-%d %H:%M UTC')).

These bundles are **unsigned** (ad-hoc on macOS: right-click → Open on first launch, or run \`xattr -dr com.apple.quarantine Tamlil.app\`). They are refreshed on every push to main; use the versioned releases for anything you distribute.

Commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"

          # Recreate so the tag follows main and stale assets disappear; the URL
          # releases/tag/latest stays the same.
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build from main (${SHORT_SHA})" \
            --notes "$NOTES" \
            $(find dist -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.sig' \) | sort)
          echo "### Downloads refreshed" >> "$GITHUB_STEP_SUMMARY"
          echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/latest" >> "$GITHUB_STEP_SUMMARY"
