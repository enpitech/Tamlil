name: "CI"

# Continuous integration for Tamlil.
#
#  * `check`  – fast feedback on every push/PR: Rust unit tests for the Tauri
#               crate and llama-helper and the TypeScript type-check. Runs on
#               Linux, so it needs the GTK/WebKit dev packages and a placeholder
#               sidecar binary (the Tauri build script insists one exists).
#  * `build`  – unsigned desktop bundles for macOS (Apple Silicon) and Windows
#               through the shared build workflow, uploaded as run artifacts.
#               Linux is built on demand only (see build-linux.yml).
#
# Signed, notarised builds are produced by release.yml (manual trigger).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build-bundles:
        description: "Also build macOS/Windows bundles"
        required: false
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Tests and type-check (Linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev cmake clang

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ci-check-linux

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Placeholder sidecar binary for the Tauri build script
        run: |
          mkdir -p frontend/src-tauri/binaries
          printf '#!/bin/sh\nexit 1\n' > frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu
          chmod +x frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu

      - name: Cache FFmpeg binary
        uses: actions/cache@v4
        with:
          path: frontend/src-tauri/binaries/ffmpeg-*
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('frontend/src-tauri/build.rs', 'frontend/src-tauri/build/ffmpeg.rs') }}

      - name: Rust unit tests (Tauri crate)
        working-directory: frontend/src-tauri
        run: cargo test --lib

      - name: Rust unit tests (llama-helper)
        working-directory: llama-helper
        run: cargo test

  build:
    name: Bundle
    needs: check
    if: github.event_name != 'workflow_dispatch' || inputs.build-bundles
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: false
      asset-prefix: "tamlil-ci"
      upload-artifacts: true
      is-debug-build: false
    secrets: inherit
