<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-label="Per-language model routing: speech is identified, then the models mapped to that language are used">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .box-accent { fill: #ecfeff; stroke: #0d9488; stroke-width: 2; }
      .box-muted { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 5; }
      .t { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0f172a; }
      .h { font-size: 17px; font-weight: 700; }
      .s { font-size: 13px; fill: #475569; }
      .lbl { font-size: 13px; font-weight: 700; fill: #0d9488; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1100" height="330" rx="20" fill="#f1f5f9"/>

  <!-- Step 1 -->
  <rect class="box" x="40" y="120" width="190" height="90" rx="14"/>
  <text class="t h" x="135" y="158" text-anchor="middle">Meeting audio</text>
  <text class="t s" x="135" y="182" text-anchor="middle">mic + system sound</text>

  <path class="edge" d="M232 165H286"/>

  <!-- Step 2 -->
  <rect class="box-accent" x="290" y="105" width="230" height="120" rx="14"/>
  <text class="t h" x="405" y="143" text-anchor="middle">Language ID</text>
  <text class="t s" x="405" y="167" text-anchor="middle">whisper on the first ~8 s</text>
  <text class="t s" x="405" y="187" text-anchor="middle">of speech, once per meeting</text>
  <text class="t s" x="405" y="207" text-anchor="middle">(or your fixed language)</text>

  <!-- branches -->
  <path class="edge" d="M522 140C580 140 590 70 650 70"/>
  <path class="edge" d="M522 165H650"/>
  <path class="edge" d="M522 190C580 190 590 260 650 260"/>

  <text class="t lbl" x="586" y="60" text-anchor="middle">he</text>
  <text class="t lbl" x="586" y="156" text-anchor="middle">en</text>
  <text class="t lbl" x="586" y="250" text-anchor="middle">other</text>

  <!-- Routes -->
  <rect class="box-accent" x="654" y="28" width="400" height="84" rx="14"/>
  <text class="t h" x="674" y="60">Hebrew route</text>
  <text class="t s" x="674" y="82">Transcribe: ivrit.ai whisper-large-v3-turbo</text>
  <text class="t s" x="674" y="100">Summarize directly in Hebrew with the GGUF you pick</text>

  <rect class="box" x="654" y="123" width="400" height="84" rx="14"/>
  <text class="t h" x="674" y="155">English route</text>
  <text class="t s" x="674" y="177">Transcribe: whisper large-v3-turbo or Parakeet</text>
  <text class="t s" x="674" y="195">Summarize: Qwen 3.5 / Gemma 3 built in, or any provider</text>

  <rect class="box-muted" x="654" y="218" width="400" height="84" rx="14"/>
  <text class="t h" x="674" y="250">No route</text>
  <text class="t s" x="674" y="272">Global transcription and summary settings apply,</text>
  <text class="t s" x="674" y="290">exactly like upstream Meetily</text>
</svg>
