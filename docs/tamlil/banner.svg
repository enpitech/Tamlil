<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Tamlil: local-first meeting notes, Hebrew-first">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#101a33"/>
      <stop offset="1" stop-color="#0d2b2e"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="860" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="340" rx="24" fill="url(#glow)"/>

  <!-- waveform motif -->
  <g transform="translate(860 170)" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <line x1="0" y1="-18" x2="0" y2="18"/>
    <line x1="22" y1="-42" x2="22" y2="42"/>
    <line x1="44" y1="-70" x2="44" y2="70"/>
    <line x1="66" y1="-30" x2="66" y2="30"/>
    <line x1="88" y1="-96" x2="88" y2="96"/>
    <line x1="110" y1="-54" x2="110" y2="54"/>
    <line x1="132" y1="-80" x2="132" y2="80"/>
    <line x1="154" y1="-24" x2="154" y2="24"/>
    <line x1="176" y1="-62" x2="176" y2="62"/>
    <line x1="198" y1="-40" x2="198" y2="40"/>
    <line x1="220" y1="-88" x2="220" y2="88"/>
    <line x1="242" y1="-34" x2="242" y2="34"/>
    <line x1="264" y1="-58" x2="264" y2="58"/>
    <line x1="286" y1="-14" x2="286" y2="14"/>
    <line x1="308" y1="-46" x2="308" y2="46"/>
    <line x1="330" y1="-20" x2="330" y2="20"/>
  </g>
  <!-- transcript lines motif -->
  <g transform="translate(862 272)" fill="#ffffff" fill-opacity="0.18">
    <rect x="0" y="0" width="330" height="8" rx="4"/>
    <rect x="70" y="18" width="260" height="8" rx="4"/>
    <rect x="0" y="36" width="210" height="8" rx="4"/>
  </g>

  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="122" font-size="26" font-weight="700" letter-spacing="2" fill="#5eead4">תמליל</text>
    <text x="72" y="196" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-2">Tamlil</text>
    <text x="72" y="244" font-size="26" fill="#cbd5e1">Local-first meeting notes. Hebrew-first.</text>

    <g transform="translate(72 274)" font-size="14" font-weight="600">
      <rect x="0" y="0" width="128" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="64" y="20" text-anchor="middle" fill="#e2e8f0">100% on-device</text>
      <rect x="138" y="0" width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="213" y="20" text-anchor="middle" fill="#e2e8f0">Bring your own model</text>
      <rect x="298" y="0" width="118" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="357" y="20" text-anchor="middle" fill="#e2e8f0">No telemetry</text>
      <rect x="426" y="0" width="96" height="30" rx="15" fill="#5eead4" fill-opacity="0.16" stroke="#5eead4" stroke-opacity="0.5"/>
      <text x="474" y="20" text-anchor="middle" fill="#99f6e4">RTL ready</text>
    </g>
  </g>
</svg>
