<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Tamlil app: meetings sidebar, live transcript with Hebrew and English lines, and a summary written in Hebrew">
  <defs>
    <linearGradient id="shadowbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#ccfbf1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <style>
      .t { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .he { font-family: 'Segoe UI', 'Noto Sans Hebrew', 'Arial Hebrew', Arial, sans-serif; direction: rtl; unicode-bidi: embed; }
      .muted { fill: #64748b; }
      .ink { fill: #0f172a; }
      .chip { fill: #ecfeff; stroke: #99f6e4; }
    </style>
  </defs>

  <rect width="1200" height="700" rx="24" fill="url(#shadowbg)"/>

  <!-- window -->
  <g filter="url(#shadow)">
    <rect x="60" y="48" width="1080" height="608" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <!-- title bar -->
  <rect x="60" y="48" width="1080" height="44" rx="16" fill="#f8fafc"/>
  <rect x="60" y="76" width="1080" height="16" fill="#f8fafc"/>
  <line x1="60" y1="92" x2="1140" y2="92" stroke="#e2e8f0"/>
  <circle cx="84" cy="70" r="6" fill="#fb7185"/>
  <circle cx="104" cy="70" r="6" fill="#fbbf24"/>
  <circle cx="124" cy="70" r="6" fill="#34d399"/>
  <text class="t" x="600" y="75" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">Tamlil</text>

  <!-- recording pill -->
  <rect x="930" y="58" width="190" height="26" rx="13" fill="#fef2f2" stroke="#fecaca"/>
  <circle cx="946" cy="71" r="5" fill="#ef4444"/>
  <text class="t" x="958" y="75" font-size="12" font-weight="600" fill="#991b1b">Recording · 00:14:32</text>

  <!-- sidebar -->
  <rect x="60" y="92" width="250" height="564" fill="#f8fafc"/>
  <line x1="310" y1="92" x2="310" y2="656" stroke="#e2e8f0"/>
  <text class="t" x="84" y="124" font-size="11" font-weight="700" letter-spacing="1.2" fill="#94a3b8">MEETINGS</text>

  <rect x="72" y="138" width="226" height="40" rx="8" fill="#e0f2fe"/>
  <text class="t he" x="286" y="163" text-anchor="start" font-size="14" font-weight="600" fill="#0c4a6e">סטנדאפ צוות מוצר</text>

  <text class="t" x="84" y="203" font-size="14" fill="#334155">Q4 roadmap review</text>
  <text class="t he" x="286" y="243" text-anchor="start" font-size="14" fill="#334155">פגישה עם לקוח – חידוש</text>
  <text class="t" x="84" y="283" font-size="14" fill="#334155">Hiring sync</text>
  <text class="t he" x="286" y="323" text-anchor="start" font-size="14" fill="#334155">רטרוספקטיבה ספרינט 12</text>
  <text class="t" x="84" y="363" font-size="14" fill="#334155">Vendor call – ONNX runtime</text>

  <rect x="72" y="596" width="226" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="t" x="185" y="621" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">⚙ Settings</text>

  <!-- transcript pane -->
  <text class="t" x="338" y="124" font-size="11" font-weight="700" letter-spacing="1.2" fill="#94a3b8">LIVE TRANSCRIPT</text>
  <rect class="chip" x="470" y="110" width="236" height="22" rx="11"/>
  <text class="t" x="588" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#0f766e">Hebrew detected · ivrit.ai large-v3-turbo</text>

  <g class="t" font-size="12" fill="#94a3b8">
    <text x="338" y="166">00:00:04</text>
    <text x="338" y="218">00:00:21</text>
    <text x="338" y="282">00:00:49</text>
    <text x="338" y="334">00:01:12</text>
    <text x="338" y="398">00:01:40</text>
    <text x="338" y="450">00:02:05</text>
  </g>

  <!-- mixed-direction transcript lines (Hebrew right-aligned) -->
  <g font-size="15" fill="#0f172a">
    <text class="t he" x="716" y="166" text-anchor="start">טוב, בואו נתחיל. יש לנו שלושה נושאים להיום.</text>
    <text class="t he" x="716" y="186" text-anchor="start">הראשון זה הדמו ללקוח ביום חמישי.</text>
    <text class="t he" x="716" y="218" text-anchor="start">דנה, איפה אנחנו עומדים עם ה-onboarding?</text>
    <text class="t he" x="716" y="238" text-anchor="start">סיימנו את המסך הראשון, נשאר ה-flow של ההרשאות.</text>
    <text class="t" x="410" y="282">Quick note in English for the record: the API</text>
    <text class="t" x="410" y="302">contract is frozen as of today.</text>
    <text class="t he" x="716" y="334" text-anchor="start">מעולה, אז לא נוגעים ב-schema עד אחרי הדמו.</text>
    <text class="t he" x="716" y="354" text-anchor="start">יובל, תוכל לסגור את הבאג של הייצוא?</text>
    <text class="t he" x="716" y="398" text-anchor="start">כן, עד מחר בצהריים.</text>
    <text class="t he" x="716" y="450" text-anchor="start">נושא שני: תמחור לרבעון הבא…</text>
  </g>
  <rect x="410" y="470" width="306" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="470" y="490" width="246" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="410" y="510" width="200" height="10" rx="5" fill="#e2e8f0"/>

  <!-- divider -->
  <line x1="748" y1="92" x2="748" y2="656" stroke="#e2e8f0"/>

  <!-- summary pane -->
  <text class="t" x="776" y="124" font-size="11" font-weight="700" letter-spacing="1.2" fill="#94a3b8">SUMMARY</text>
  <rect class="chip" x="990" y="110" width="126" height="22" rx="11"/>
  <text class="t" x="1053" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#0f766e">Qwen 3.5 · Hebrew</text>

  <g font-size="14" fill="#0f172a">
    <text class="t he" x="1116" y="172" text-anchor="start" font-size="20" font-weight="800">סטנדאפ צוות מוצר – סיכום</text>

    <text class="t he" x="1116" y="214" text-anchor="start" font-size="15" font-weight="700" fill="#0f766e">החלטות</text>
    <text class="t he" x="1100" y="238" text-anchor="start">חוזה ה-API מוקפא; אין שינויים ב-schema עד אחרי הדמו</text>
    <text class="t he" x="1100" y="260" text-anchor="start">הדמו ללקוח יתקיים ביום חמישי כמתוכנן</text>
    <circle cx="1112" cy="234" r="3" fill="#0f766e"/>
    <circle cx="1112" cy="256" r="3" fill="#0f766e"/>

    <text class="t he" x="1116" y="302" text-anchor="start" font-size="15" font-weight="700" fill="#0f766e">משימות</text>
    <rect x="1098" y="316" width="14" height="14" rx="3" fill="#ffffff" stroke="#94a3b8"/>
    <text class="t he" x="1088" y="328" text-anchor="start">דנה – להשלים את flow ההרשאות ב-onboarding</text>
    <rect x="1098" y="340" width="14" height="14" rx="3" fill="#ffffff" stroke="#94a3b8"/>
    <text class="t he" x="1088" y="352" text-anchor="start">יובל – לסגור את באג הייצוא עד מחר בצהריים</text>
    <rect x="1098" y="364" width="14" height="14" rx="3" fill="#ffffff" stroke="#94a3b8"/>
    <text class="t he" x="1088" y="376" text-anchor="start">נועה – להכין הצעת תמחור לרבעון הבא</text>

    <text class="t he" x="1116" y="420" text-anchor="start" font-size="15" font-weight="700" fill="#0f766e">נקודות עיקריות</text>
    <text class="t he" x="1100" y="444" text-anchor="start">מסך ה-onboarding הראשון הושלם</text>
    <text class="t he" x="1100" y="466" text-anchor="start">תמחור לרבעון הבא ייסגר בפגישה הבאה</text>
    <circle cx="1112" cy="440" r="3" fill="#0f766e"/>
    <circle cx="1112" cy="462" r="3" fill="#0f766e"/>
  </g>

  <!-- footer status -->
  <rect x="776" y="596" width="340" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="t" x="792" y="620" font-size="12" fill="#64748b">Everything processed on this Mac · nothing uploaded</text>
</svg>
